<!DOCTYPE html>
<html>
<head>
    <title>Teddy Day</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #5d4037, #6d4c41, #4e342e);
            color: #fff8e1;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .content {
            padding: 40px 20px;
        }

        .text {
            font-size: 1.3rem;
            line-height: 1.8;
            text-shadow: 0 0 10px rgba(255, 204, 128, 0.6);
        }

        .teddy {
            margin-top: 30px;
            width: 260px;
            filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.5));
        }

        .btn {
            margin-top: 35px;
            background-color: #8d6e63;
            border: none;
            padding: 14px 28px;
            color: white;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            background-color: #a1887f;
        }
    </style>
</head>

<body>

    <div class="content">

        <div class="text">
            Tere mein pta nhi aisa kya hai <br>
            par jab hi teri mai awaaz sunu ya teri photo dekhun <br>
            mera din chahe jitna bhi kharab kyun na ho <br>
            kuch bhi ho rha ho mai ussi time thik ho jata hun <br>
            aisa lagta hai ki kuch hua hi nhi tha <br>
            nitya hai toh sahi mere pass <br>
            I lovee youuuuu ❤️❤️
        </div>

        <!-- Big Teddy Holding Heart -->
        <img class="teddy"
        src="https://pngimg.com/uploads/teddy_bear/teddy_bear_PNG37.png"
        alt="Teddy Bear">

        <br>

        <button class="btn" onclick="location.href='promise.html'">
            Aage kya haii 👉
        </button>

    </div>

</body>
</html>
